name: "eon_sverige_future_state"
version: "1.0.0"
config-version: 2

profile: "eon_sverige_future_state"

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # The fixture window is 2026-04-01 through 2026-06-30. dbt does full-refresh
  # over the whole window on every partition run -- Dagster's monthly partition
  # bookkeeping per model is independent of dbt's own execution granularity
  # (same pattern as demos/rvu-tempcover and demos/neighborhood-intelligence-taxi).
  window_start: "2026-04-01"
  window_end: "2026-06-30"

# Model groups drive Dagster group_name via dagster-dbt's manifest-native
# `config.group` translator hook. One instance of DbtProjectComponent
# covers the whole project; the folder -> group mapping below decides
# which Dagster group each model lands in.
models:
  eon_sverige_future_state:
    silver:
      +group: dbt_transformation
      +materialized: view
      +schema: silver
    gold:
      +group: dbt_transformation
      +materialized: table
      +schema: gold
    curated:
      +group: curated_data_products
      +materialized: table
      +schema: curated
