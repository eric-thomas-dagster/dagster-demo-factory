type: eon_sverige_future_state.components.CronScheduleComponent

attributes:
  # Full pipeline for the previous month's partition.
  #
  # `cron_expression` and `execution_timezone` are OMITTED on purpose:
  # in the partitioned-job path the component calls
  # `build_schedule_from_partitioned_job`, which rejects those two
  # kwargs when the job is time-partitioned. The cadence is inferred
  # from the monthly partitions_def below and each tick auto-targets
  # the most-recent finished partition.
  schedule_name: eon_monthly_full_pipeline_schedule
  default_status: STOPPED
  job_name: eon_monthly_full_pipeline_job

  partition_type: monthly
  partition_start: "2026-04-01"

  # Every executable asset in the pipeline. Bronze external source
  # assets (source/raw_meter_reads, etc.) are AssetSpec-only and not
  # executable, so they cannot be members of an asset job selection --
  # the job takes the Databricks jobs as its roots and the bronze
  # source assets remain upstream in the lineage graph.
  asset_keys:
    - bronze/meter_reads_delta
    - bronze/grid_load_telemetry_delta
    - bronze/customer_records_delta
    - bronze/bronze_dq_gate
    - silver/stg_meter_reads
    - silver/stg_grid_telemetry
    - gold/fct_meter_daily
    - gold/fct_grid_hourly
    - gold/dim_customer_current
    - curated/customer_switching_extract
    - grid_load_forecast_model
    - meter_anomaly_predictions
    - grid_operations_daily_briefing

  tags:
    team: eon-data-platform
    schedule_role: monthly_full_pipeline
