[project]
name = "skygen"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.25",
    "dagster-cloud>=1.13.25",
    "dagster-dbt>=0.29.25",
    "dagster-duckdb>=0.29.25",
    "dagster-fivetran>=0.29.25",
    "dagster-sigma>=0.29.25",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "pex>=2.59.5",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }
# Both paths are gitignored, and hatchling excludes gitignored files from the
# wheel by default -- they then go missing at runtime in Dagster+. See
# LEARNINGS.md and scripts/preflight_deploy.sh.
artifacts = [
    "src/skygen/defs/.local_defs_state/**",
    "src/skygen/dbt_project/target/**",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "skygen"
registry_modules = [
    "skygen.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
skygen_components = "skygen.components"
