[project]
name = "kapitus"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.19",
    "dagster-cloud>=1.13.19",
    "dagster-dbt>=0.29.19",
    "dagster-duckdb>=0.29.19",
    "dagster-duckdb-pandas>=0.29.19",
    "dagster-aws>=0.29.19",
    "dbt-core>=1.11.14",
    "dbt-duckdb>=1.11.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pex>=2.59.5",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both paths are gitignored, and hatchling excludes gitignored files from the
# wheel by default -- they then go missing at runtime in Dagster+. See
# LEARNINGS.md and templates/preflight_deploy.sh.
force-include = { "pyproject.toml" = "pyproject.toml" }
artifacts = [
    "src/kapitus/defs/.local_defs_state/**",
    "src/kapitus/dbt_project/target/**",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "kapitus"
registry_modules = [
    "kapitus.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
kapitus_components = "kapitus.components"
