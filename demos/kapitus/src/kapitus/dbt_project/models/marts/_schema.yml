version: 2

models:
  - name: funded_loans_daily
    description: "One row per funded loan application, with borrower and product context. The money-shot asset, freshness-policed."
    columns:
      - name: application_id
        data_tests: [unique, not_null]

  - name: portfolio_performance_by_product
    description: "Daily application/approval performance, one row per (date, product_line)."
    columns:
      - name: application_date
        data_tests: [not_null]
      - name: product_line
        data_tests: [not_null]

  - name: credit_risk_summary
    description: "Daily underwriting risk profile, one row per (date, product_line)."
    columns:
      - name: pull_date
        data_tests: [not_null]
      - name: product_line
        data_tests: [not_null]
