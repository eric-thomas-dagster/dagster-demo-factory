name: "kapitus"
version: "1.0.0"
config-version: 2

profile: "kapitus"

model-paths: ["models"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Wide bound rather than a fixed demo-window end: bronze ingestion is on an
  # open-ended DailyPartitionsDefinition (see components/partitions.py), so
  # these models (small full-refresh transforms over the whole staged
  # window, not incremental builds scoped to one partition) keep working
  # for whatever day the demo is actually run on. Dagster's partition
  # bookkeeping per model is independent of dbt's own execution granularity
  # here -- same pattern used by the Stellantis Financial Services build.
  min_date: "2026-08-01"
  max_date: "2026-12-31"

models:
  kapitus:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
    analytics:
      +materialized: table
      +schema: analytics

seeds:
  kapitus:
    +schema: staging
