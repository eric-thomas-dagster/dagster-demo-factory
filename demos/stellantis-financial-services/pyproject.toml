[project]
name = "stellantis_financial_services"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.19",
    "dagster-cloud>=1.13.19",
    "duckdb>=1.5.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Gitignored (dg-generated), and hatchling excludes gitignored files from the
# wheel by default -- they then go missing at runtime in Dagster+. See
# LEARNINGS.md and scripts/preflight_deploy.sh. Run `dg utils
# refresh-defs-state` before deploying so this cache is current.
force-include = { "pyproject.toml" = "pyproject.toml" }
artifacts = [
    "src/stellantis_financial_services/defs/.local_defs_state/**",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "stellantis_financial_services"
registry_modules = [
    "stellantis_financial_services.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
stellantis_financial_services_components = "stellantis_financial_services.components"
