[project]
name = "stellantis_financial_services"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.19",
    "dagster-cloud>=1.13.19",
    "dagster-dbt>=0.29.19",
    "dagster-duckdb>=0.29.19",
    "dagster-duckdb-pandas>=0.29.19",
    "dagster-azure>=0.29.19",
    "dagster-msteams>=0.29.19",
    "dbt-core>=1.11.14",
    "dbt-duckdb>=1.11.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pex>=2.59.5",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both paths are gitignored, and hatchling excludes gitignored files from the
# wheel by default -- they then go missing at runtime in Dagster+ with a
# confusing path error. `.local_defs_state/` holds the compiled dbt manifest
# state-backed components load from; regenerate with `dg utils refresh-defs-state`
# before building. `dbt_project/target/` holds the compiled manifest dbt itself
# reads at execution time. See LEARNINGS.md.
force-include = { "pyproject.toml" = "pyproject.toml" }
artifacts = [
    "src/stellantis_financial_services/defs/.local_defs_state/**",
    "src/stellantis_financial_services/dbt_project/target/**",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "stellantis_financial_services"
registry_modules = [
    "stellantis_financial_services.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
stellantis_financial_services_components = "stellantis_financial_services.components"
