type: stellantis_financial_services.components.FabricPipelineAssetComponent
attributes:
  asset_key: fact_delinquency_snapshot
  generator_key: fact_delinquency_snapshot
  description: >
    Delinquent slice of the active portfolio with DPD bucket, produced by
    the pl_build_fact_delinquency_snapshot Fabric pipeline. This is the
    asset someone gets paged over -- freshness-policed accordingly.
  group_name: gold
  kinds: [fabric, azure]
  pipeline_name: pl_build_fact_delinquency_snapshot
  deps: [fact_loan_portfolio, stg_delinquency_events]
  partitions: daily
  dollar_metadata_column: outstanding_balance
  # Pages someone if this goes more than 6h stale; warns at 3h.
  freshness_fail_hours: 6
  freshness_warn_hours: 3
  fabric_item_name: pl_build_fact_delinquency_snapshot
