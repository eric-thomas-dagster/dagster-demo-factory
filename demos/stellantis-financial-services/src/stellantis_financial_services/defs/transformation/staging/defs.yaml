type: stellantis_financial_services.components.SfsDbtComponent

template_vars_module: .template_vars

attributes:
  project:
    project_dir: ../../../dbt_project
  op:
    name: dbt_staging
  select: "stg_loan_originations stg_lease_originations stg_payment_transactions stg_delinquency_events dim_dealer dim_borrower"
  translation:
    group_name: staging
    partitions_def: "{{ dg.DailyPartitionsDefinition(start_date='2026-08-01', timezone='America/Detroit') }}"

post_processing:
  assets:
    - target: "staging/stg_loan_originations"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
    - target: "staging/stg_lease_originations"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
    - target: "staging/stg_payment_transactions"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
    - target: "staging/stg_delinquency_events"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
    - target: "staging/dim_dealer"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
    - target: "staging/dim_borrower"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
