type: stellantis_financial_services.components.DuckDbAssetCheckComponent
attributes:
  asset_key: abs_pool_eligibility
  check_name: abs_pool_eligibility_reconciliation
  blocking: true
  description: >
    The eligible pool is a non-empty subset of that day's current (non-
    delinquent) portfolio contracts, and its balance doesn't exceed the
    portfolio's. Maps to: SFS's 2026 auto/lease ABS securitization
    calendar and investor/rating-agency scrutiny of loan-tape accuracy --
    this asset is not considered pool-reportable until it passes.
  sql: >
    SELECT
      (
        (SELECT COUNT(*) FROM gold.abs_pool_eligibility WHERE as_of_date = '{date}') > 0
        AND (SELECT COUNT(*) FROM gold.abs_pool_eligibility WHERE as_of_date = '{date}')
            <= (SELECT COUNT(*) FROM gold.fact_loan_portfolio WHERE as_of_date = '{date}' AND status = 'current')
        AND (SELECT SUM(outstanding_balance) FROM gold.abs_pool_eligibility WHERE as_of_date = '{date}')
            <= (SELECT SUM(outstanding_balance) FROM gold.fact_loan_portfolio WHERE as_of_date = '{date}' AND status = 'current')
      ) AS passed,
      (SELECT COUNT(*) FROM gold.abs_pool_eligibility WHERE as_of_date = '{date}') AS eligible_count,
      (SELECT SUM(outstanding_balance) FROM gold.abs_pool_eligibility WHERE as_of_date = '{date}') AS eligible_balance
