type: stellantis_financial_services.components.PartitionedIngestionScheduleComponent
attributes:
  job_name: bronze_daily_ingestion_job
  description: >
    Vendor files land by ~5am; this triggers the day's bronze ingestion
    pipelines so the conformed layer is ready before the 8am business
    start -- the real deadline behind SFS's "SLA/lateness visibility" ask.
  asset_selection:
    - raw_loan_originations
    - raw_lease_originations
    - raw_payment_transactions
    - raw_credit_bureau_pull
  partitions: daily
  hour_of_day: 6
