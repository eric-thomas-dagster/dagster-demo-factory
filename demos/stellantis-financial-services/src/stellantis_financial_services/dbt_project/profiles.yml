stellantis_financial_services:
  target: "{{ env_var('SFS_DBT_TARGET', 'demo') }}"
  outputs:
    demo:
      type: duckdb
      # `__init__.py` sets this env var to a working project-relative default
      # (`demo_data/demo.duckdb`) before Dagster loads any defs, so this
      # always resolves even with zero manual setup. Override it to point
      # dbt at a different DuckDB file without touching this profile.
      path: "{{ env_var('SFS_DEMO_DUCKDB_PATH') }}"
      threads: 4
    live:
      type: fabric
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('SFS_FABRIC_SQL_ENDPOINT') }}"
      database: "{{ env_var('SFS_FABRIC_DATABASE') }}"
      authentication: "ActiveDirectoryServicePrincipal"
      client_id: "{{ env_var('SFS_FABRIC_CLIENT_ID') }}"
      client_secret: "{{ env_var('SFS_FABRIC_CLIENT_SECRET') }}"
      tenant_id: "{{ env_var('SFS_FABRIC_TENANT_ID') }}"
      schema: "marts"
      threads: 4
