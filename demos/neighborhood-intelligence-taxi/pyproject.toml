[project]
name = "neighborhood_intelligence_taxi"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.21",
    "dagster-cloud>=1.13.21",
    "dagster-dbt>=0.29.21",
    "dagster-duckdb>=0.29.21",
    "dagster-gcp>=0.29.21",
    "dbt-core>=1.11.14",
    "dbt-duckdb>=1.11.0",
    "dbt-bigquery>=1.11.0",
    "duckdb>=1.5.5",
    "pex>=2.59.5,<2.60.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both paths are gitignored, and hatchling excludes gitignored files from the
# wheel by default -- they then go missing at runtime in Dagster+. See
# LEARNINGS.md and scripts/preflight_deploy.sh.
force-include = { "pyproject.toml" = "pyproject.toml" }
artifacts = [
    "src/neighborhood_intelligence_taxi/defs/.local_defs_state/**",
    "src/neighborhood_intelligence_taxi/dbt_project/target/**",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "neighborhood_intelligence_taxi"
registry_modules = [
    "neighborhood_intelligence_taxi.components.*",
]

[project.entry-points."dagster_dg_cli.registry_modules"]
neighborhood_intelligence_taxi_components = "neighborhood_intelligence_taxi.components"
