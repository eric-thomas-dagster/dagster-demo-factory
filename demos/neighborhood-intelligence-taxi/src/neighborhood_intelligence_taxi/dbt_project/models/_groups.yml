version: 2

# Model groups declared for the `+group:` config in dbt_project.yml.
# dagster-dbt reads each model's `config.group` from the compiled manifest
# and sets Dagster's `group_name` per asset -- so silver / gold / report
# folders render as three distinct groups in the Dagster UI without any
# Dagster-side translation.
groups:
  - name: silver
    owner:
      name: "NIT Data Platform"
      email: "data-platform@neighborhoodintelligence.example"
  - name: gold
    owner:
      name: "NIT Data Platform"
      email: "data-platform@neighborhoodintelligence.example"
  - name: report
    owner:
      name: "NIT Data Platform"
      email: "data-platform@neighborhoodintelligence.example"
