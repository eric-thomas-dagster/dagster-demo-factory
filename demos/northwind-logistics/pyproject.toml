[project]
name = "northwind_logistics"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.19",
    "dagster-cloud>=1.13.19",
    "dagster-dbt>=0.29.19",
    "dagster-duckdb>=0.29.19",
    "dagster-fivetran>=0.29.19",
    "dagster-snowflake>=0.29.19",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The compiled dbt manifest and the state-backed components' cached state are
# both gitignored (generated by `dg utils refresh-defs-state`, run right
# before every deploy) and hatchling's default wheel packaging excludes
# anything VCS-ignored -- force-include them so the deployed PEX actually
# has a manifest to read.
force-include = { "pyproject.toml" = "pyproject.toml", "src/northwind_logistics/dbt_project/target" = "northwind_logistics/dbt_project/target", "src/northwind_logistics/defs/.local_defs_state" = "northwind_logistics/defs/.local_defs_state" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "northwind_logistics"
registry_modules = [
    "northwind_logistics.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
northwind_logistics_components = "northwind_logistics.components"
