type: northwind_logistics.components.NorthwindDbtComponent

template_vars_module: .template_vars

attributes:
  demo_mode: true
  project:
    project_dir: ../../../dbt_project
  op:
    name: dbt_marts
  select: "shipments_by_lane invoice_line_items carrier_cost_allocation invoice_billing_nightly margin_by_lane_customer"
  cli_args:
    - build
    - --vars:
        min_date: "{{ partition_time_window.start.strftime('%Y-%m-%d') }}"
        max_date: "{{ partition_time_window.end.strftime('%Y-%m-%d') }}"
  translation:
    group_name: transformation
    kinds: [dbt]
    partitions_def: "{{ dg.DailyPartitionsDefinition(start_date='2026-08-15', end_date='2026-08-25', timezone='America/New_York') }}"

post_processing:
  assets:
    - target: "marts/carrier_cost_allocation"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
    - target: "marts/margin_by_lane_customer"
      attributes:
        automation_condition: "{{ recompute_after_upstream_and_checks_pass }}"
        freshness_policy: "{{ finance_freshness_policy }}"
    - target: "marts/invoice_billing_nightly"
      attributes:
        freshness_policy: "{{ finance_freshness_policy }}"
