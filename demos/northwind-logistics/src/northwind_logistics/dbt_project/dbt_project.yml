name: "northwind_logistics_dbt"
version: "1.0.0"
config-version: 2

profile: "northwind_logistics"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  northwind_logistics_dbt:
    +materialized: incremental
    +incremental_strategy: delete+insert
    staging:
      +meta:
        dagster:
          group: validation
    marts:
      +meta:
        dagster:
          group: transformation
