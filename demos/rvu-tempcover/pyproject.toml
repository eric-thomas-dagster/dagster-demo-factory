[project]
name = "rvu_tempcover"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.21",
    "dagster-cloud>=1.13.21",
    "dagster-dbt>=0.29.21",
    "dagster-duckdb>=0.29.21",
    "dagster-fivetran>=0.29.21",
    "dagster-gcp>=0.29.21",
    "dagster-powerbi>=0.29.21",
    "azure-identity>=1.12.0",
    "azure-mgmt-datafactory>=4.0.0",
    "dbt-core>=1.11.14",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "pex>=2.59.5,<2.60.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Both paths are gitignored, and hatchling excludes gitignored files from the
# wheel by default -- they then go missing at runtime in Dagster+. See
# LEARNINGS.md and scripts/preflight_deploy.sh.
force-include = { "pyproject.toml" = "pyproject.toml" }
artifacts = [
    "src/rvu_tempcover/defs/.local_defs_state/**",
    "src/rvu_tempcover/dbt_project/target/**",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "rvu_tempcover"
registry_modules = [
    "rvu_tempcover.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
rvu_tempcover_components = "rvu_tempcover.components"
