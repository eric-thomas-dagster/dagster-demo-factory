type: rvu_tempcover.components.RvuDbtComponent

template_vars_module: .template_vars

attributes:
  project:
    project_dir: ../../../dbt_project
  op:
    name: dbt_staging
  select: "stg_quote_requests stg_bound_policies stg_panel_feed dim_partner"
  translation:
    group_name: dbt
    owners: ["team:rvu-data-platform"]
    metadata:
      owner: "RVU Data Platform"
      owner_team: "team:rvu-data-platform"
      tier: "tier_1"
      domain: "quoting_and_policy"

post_processing:
  assets:
    - target: "staging/stg_quote_requests"
      attributes:
        automation_condition: "{{ eager }}"
    - target: "staging/stg_bound_policies"
      attributes:
        automation_condition: "{{ eager }}"
    - target: "staging/stg_panel_feed"
      attributes:
        automation_condition: "{{ eager_after_panel_check }}"
    - target: "marts/dim_partner"
      attributes:
        automation_condition: "{{ eager }}"
