version: 2

models:
  - name: stg_quote_requests
    description: "Typed quote requests across every channel."
    columns:
      - name: quote_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]

  - name: stg_bound_policies
    description: "Typed bound policies, ready for panel and partner reconciliation."
    columns:
      - name: policy_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: premium_amount
        data_tests: [not_null]

  - name: stg_panel_feed
    description: "Typed daily panel insurer capacity feed."
    columns:
      - name: insurer_id
        data_tests: [not_null]
      - name: feed_date
        data_tests: [not_null]
