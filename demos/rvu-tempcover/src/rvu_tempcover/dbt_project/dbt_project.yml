name: "rvu_tempcover"
version: "1.0.0"
config-version: 2

profile: "rvu_tempcover"

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Wide bound rather than a fixed demo-window end: the fixture data spans a
  # fixed 35-day window (see demo_data/fixtures/), but Dagster's daily
  # partitions on the two facts are open-ended (components/partitions.py).
  # These models are small full-refresh transforms over the whole fixture
  # window, not incremental builds scoped to one partition -- Dagster's
  # partition bookkeeping per model is independent of dbt's own execution
  # granularity here, same pattern used by demos/kapitus and demos/stellantis.
  min_date: "2026-08-01"
  max_date: "2026-12-31"

models:
  rvu_tempcover:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
