[project]
name = "trafigura"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.20",
    "dagster-cloud>=1.13.20",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "trafigura"
registry_modules = [
    "trafigura.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
trafigura_components = "trafigura.components"
