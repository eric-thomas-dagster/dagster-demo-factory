version: 2

models:
  - name: stg_bookings
    description: "Typed bookings, ready for daily rollups -- the ingestion pain point in the room, made concrete."
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: specialist_id
        data_tests: [not_null]
      - name: booking_date
        data_tests: [not_null]

  - name: stg_specialists
    description: "Typed specialist roster."
    columns:
      - name: specialist_id
        data_tests: [unique, not_null]
      - name: region
        data_tests: [not_null]
