[project]
name = "marketgrader"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.24",
    "dagster-iceberg>=0.3.14",
    "pyarrow>=25.0.1",
    "pyiceberg>=0.11.1",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "marketgrader"
registry_modules = [
    "marketgrader.components.*",
]



[project.entry-points."dagster_dg_cli.registry_modules"]
marketgrader_components = "marketgrader.components"
