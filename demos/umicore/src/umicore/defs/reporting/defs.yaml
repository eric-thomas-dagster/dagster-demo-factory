type: umicore.components.UmicorePowerBIComponent

attributes:
  demo_mode: true

  # Never called in demo mode -- placeholder literals are enough (all three
  # credential fields are required strings). To run against Umicore's real
  # Power BI workspace: set demo_mode to false, fill in the real
  # workspace_id, and replace the three credential lines with
  # `{{ env.POWERBI_CLIENT_ID }}` / `{{ env.POWERBI_CLIENT_SECRET }}` /
  # `{{ env.POWERBI_TENANT_ID }}`.
  workspace:
    credentials:
      client_id: "unused-in-demo-mode"
      client_secret: "unused-in-demo-mode"
      tenant_id: "unused-in-demo-mode"
    workspace_id: "umicore-demo-powerbi-workspace"

  # The semantic model this component discovers is the dataset backing
  # power_bi_mesh_health_dashboard_refresh -- refreshing it is the real
  # triggerable action, so it's the one Power BI object worth making
  # materializable (see components/powerbi.py module docstring).
  enable_semantic_model_refresh: true
