umicore:
  target: "{{ env_var('UMICORE_DBT_TARGET', 'demo') }}"
  outputs:
    demo:
      type: duckdb
      # `__init__.py` sets this env var to a working project-relative default
      # (`demo_data/demo.duckdb` -- the same file the Databricks/generic raw
      # layer writes into) before Dagster loads any defs, so this always
      # resolves with zero manual setup. Override it to point dbt at a
      # different DuckDB file without touching this profile.
      path: "{{ env_var('UMICORE_DEMO_DUCKDB_PATH') }}"
      threads: 4
    live:
      # Umicore's confirmed transformation stack is dbt + Databricks -- the
      # warehouse/lakehouse product itself is never named in the AE notes
      # (marked low-confidence, "likely Azure-native"), so this target is a
      # representative dbt-databricks profile, not a confirmed one. Adjust
      # catalog/schema/host to Umicore's actual workspace before use.
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'umicore_mesh') }}"
      schema: "marts"
      threads: 4
