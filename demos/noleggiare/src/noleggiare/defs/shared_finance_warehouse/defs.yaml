type: noleggiare.components.WarehouseTableAssetsComponent

attributes:
  io_manager_key: postgres_io_manager
  assets:
    - key: dim_vehicle
      deps: ["fleet_vehicles_raw", "vehicle_inventory_raw"]
      group_name: shared_finance_warehouse
      kinds: ["postgres"]
      owners: ["team:noleggiare-bi"]
      automation_condition: "{{ dg.AutomationCondition.eager() }}"
      description: >-
        Curated, cross-company vehicle dimension -- one VIN-keyed record
        spanning Noleggiare's rental fleet and Tomasi Auto's dealer
        inventory. The record the cross-company consistency check runs
        against.
      metadata:
        owner: "Noleggiare/Tomasi Auto BI Team"
        owner_team: "team:noleggiare-bi"
        tier: "tier_1"
        domain: "finance"
        deployment_mode: "demo (stub rows written through a real Postgres IO manager, DuckDB-backed)"
        business_impact: >-
          A VIN active in both fleet and dealer inventory at once means a
          vehicle is being reported twice across the group's finances.

    - key: dim_customer
      deps: ["rental_bookings_raw", "dealer_sales_raw"]
      group_name: shared_finance_warehouse
      kinds: ["postgres"]
      owners: ["team:noleggiare-bi"]
      automation_condition: "{{ dg.AutomationCondition.eager() }}"
      description: >-
        Curated, cross-company customer dimension -- unifies rental
        bookers and dealer buyers into one customer record for
        Finance-owned reporting.
      metadata:
        owner: "Noleggiare/Tomasi Auto BI Team"
        owner_team: "team:noleggiare-bi"
        tier: "tier_1"
        domain: "finance"
        deployment_mode: "demo (stub rows written through a real Postgres IO manager, DuckDB-backed)"

    - key: fact_rental_contract
      deps: ["rental_contracts_raw", "dim_vehicle", "dim_customer"]
      group_name: shared_finance_warehouse
      kinds: ["postgres"]
      owners: ["team:noleggiare-bi"]
      partitions_def: "{{ daily_partitions }}"
      automation_condition: "{{ dg.AutomationCondition.eager() }}"
      description: >-
        Curated daily rental contract fact -- one row per signed contract,
        resolved against the vehicle and customer dimensions. Feeds the
        cross-company consolidated fact and the residual-value forecast.
      metadata:
        owner: "Noleggiare/Tomasi Auto BI Team"
        owner_team: "team:noleggiare-bi"
        tier: "tier_1"
        domain: "finance"
        deployment_mode: "demo (stub rows written through a real Postgres IO manager, DuckDB-backed)"
        business_impact: "Direct input to Noleggiare's daily rental revenue reporting."

    - key: fact_vehicle_sale
      deps: ["dealer_sales_raw", "service_orders_raw", "dim_vehicle", "dim_customer"]
      group_name: shared_finance_warehouse
      kinds: ["postgres"]
      owners: ["team:noleggiare-bi"]
      partitions_def: "{{ daily_partitions }}"
      automation_condition: "{{ dg.AutomationCondition.eager() }}"
      description: >-
        Curated daily vehicle sale fact -- one row per completed dealer
        sale, resolved against the vehicle and customer dimensions and
        enriched with post-sale service order volume for warranty
        reserve. Feeds the cross-company consolidated fact and the
        residual-value forecast.
      metadata:
        owner: "Noleggiare/Tomasi Auto BI Team"
        owner_team: "team:noleggiare-bi"
        tier: "tier_1"
        domain: "finance"
        deployment_mode: "demo (stub rows written through a real Postgres IO manager, DuckDB-backed)"
        business_impact: "Direct input to Tomasi Auto's daily sales revenue reporting."

    - key: fact_finance_consolidated_daily
      deps: ["fact_rental_contract", "fact_vehicle_sale"]
      group_name: shared_finance_warehouse
      kinds: ["postgres"]
      owners: ["team:noleggiare-bi"]
      partitions_def: "{{ company_date_partitions }}"
      automation_condition: "{{ dg.AutomationCondition.eager() }}"
      freshness_policy: "{{ dg.FreshnessPolicy.time_window(fail_window=datetime.timedelta(hours=24), warn_window=datetime.timedelta(hours=18)) }}"
      description: >-
        Daily consolidated revenue fact across both companies, partitioned
        by date AND company -- the money-shot asset: one asset,
        materialized per company, that is Raffaele's direct answer to "how
        do we structure Dagster across two companies, still separable."
        Feeds the Qlik Cloud export.
      metadata:
        owner: "Noleggiare/Tomasi Auto BI Team"
        owner_team: "team:noleggiare-bi"
        tier: "tier_1"
        domain: "finance"
        severity: "high"
        sla: "Available by 07:00 CET for the Finance morning read"
        deployment_mode: "demo (stub rows written through a real Postgres IO manager, DuckDB-backed)"
        business_impact: >-
          Feeds the group-wide Qlik Cloud finance dashboard both
          companies' Finance leadership reads every morning.
